name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add iOS platform
        run: |
          cordova platform add ios

      - name: Build iOS (debug)
        run: |
          cordova build ios --debug

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r platforms/ios/build/device/*.app Payload/ 2>/dev/null || \
          cp -r platforms/ios/build/Debug-iphoneos/*.app Payload/ 2>/dev/null || \
          cp -r platforms/ios/build/Release-iphoneos/*.app Payload/ 2>/dev/null || \
          find platforms/ios -name "*.app" -exec cp -r {} Payload/ \;
          zip -r KsyushaApp.ipa Payload/
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KsyushaApp-ipa
          path: KsyushaApp.ipa
          if-no-files-found: warn
          retention-days: 7
